<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Agregar Nueva Habilidad</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">


  
  <div class="container mt-5">
    <div class="card shadow border-0 rounded-4 p-4">
      <h4 class="mb-4 text-center">Agregar Nueva Habilidad</h4>
      <form id="habilidadForm">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre de la habilidad</label>
          <input type="text" class="form-control" id="nombre" required>
        </div>

        <div class="mb-3">
          <label for="descripcion" class="form-label">Descripción</label>
          <textarea class="form-control" id="descripcion" rows="3" required></textarea>
        </div>

        <div class="text-center">
          <button type="submit" class="btn btn-outline-primary rounded-pill px-4">Guardar</button>
        </div>
      </form>

      <div id="mensaje" class="mt-3 text-center"></div>
    </div>
  </div>

  <script>
    // Verifica si hay token, si no, redirige a login.html
    const token = localStorage.getItem("access_token");
    if (!token) {
      alert("Debes iniciar sesión primero.");
      window.location.href = "inicio-sesion.html";
    }

    const form = document.getElementById('habilidadForm');
    const mensaje = document.getElementById('mensaje');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const nombre = document.getElementById('nombre').value;
      const descripcion = document.getElementById('descripcion').value;

      try {
        const respuesta = await fetch('http://127.0.0.1:8000/competencias/competencias/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ nombre, descripcion })
        });

        if (respuesta.ok) {
          mensaje.innerHTML = '<div class="alert alert-success">¡Habilidad agregada correctamente!</div>';
          form.reset();
        } else if (respuesta.status === 401) {
          mensaje.innerHTML = '<div class="alert alert-danger">Sesión expirada. Por favor inicia sesión de nuevo.</div>';
          localStorage.removeItem("token");
          setTimeout(() => window.location.href = "inicio-sesion.html", 2000);
        } else {
          mensaje.innerHTML = '<div class="alert alert-danger">Error al agregar la habilidad.</div>';
        }

      } catch (error) {
        mensaje.innerHTML = '<div class="alert alert-danger">No se pudo conectar con el servidor.</div>';
        console.error(error);
      }
    });
  </script>

</body>
</html>
