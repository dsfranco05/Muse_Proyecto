<script>
const competenciaId = 15; // Reemplaza con el ID real

async function cargarEjercicios() {
  try {
    const token = localStorage.getItem("access_token");
    const response = await fetch(`http://localhost:8000/problemas/${competenciaId}`, {
      headers: {
        Authorization: `Bearer ${token}`
      }
    });

    const ejercicios = await response.json();
    const tabla = document.getElementById("tabla-ejercicios");
    tabla.innerHTML = "";

    ejercicios.forEach(ejercicio => {
      const fila = document.createElement("tr");

      // Si existe PDF
      const tienePDF = ejercicio.archivo_pdf !== null;
      const archivoNombre = tienePDF ? ejercicio.archivo_pdf.replace(/\\/g, "/").split("/").pop() : null;
      const enlaceDescarga = tienePDF
        ? `<a href="http://localhost:8000/media/problemas/${archivoNombre}" download class="btn btn-outline-primary btn-sm mb-0">PDF</a>`
        : `<span class="text-muted">No disponible</span>`;

fila.innerHTML = `
  <td>
    <div class="d-flex px-2 py-1">
      <div class="d-flex flex-column justify-content-center">
        <h6 class="mb-0 text-sm">${ejercicio.titulo}</h6>
        <p class="text-xs text-secondary mb-0">${ejercicio.descripcion}</p>
      </div>
    </div>
  </td>
  <td></td>
  <td class="align-middle text-center text-sm">
    <label class="btn btn-success btn-sm mb-0">
      Subir solución
      <input type="file" accept=".py,.cpp" hidden onchange="subirSolucion(${ejercicio.id}, this.files[0])">
    </label>
  </td>
  <td class="align-middle text-center"></td>
  <td class="align-middle text-center">
    ${enlaceDescarga}
  </td>
`;

tabla.appendChild(fila);

    });

  } catch (error) {
    console.error("Error al cargar ejercicios:", error);
  }
}

async function subirSolucion(problemaId, archivo) {
  const formData = new FormData();
  formData.append("archivo", archivo);

  const token = localStorage.getItem("access_token");

  try {
    const res = await fetch(`http://localhost:8000/problemas/subir_solucion/${problemaId}`, {
      method: "POST",
      headers: {
        Authorization: `Bearer ${token}`
      },
      body: formData
    });

    const data = await res.json();
    alert(data.mensaje || "Solución subida correctamente");
  } catch (error) {
    console.error("Error al subir solución:", error);
    alert("Ocurrió un error al subir la solución");
  }
}

window.onload = cargarEjercicios;

</script>
